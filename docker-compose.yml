version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: alz_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=alz_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    expose:
      - 5432

  redis:
    image: redis:7-alpine
    container_name: alz_redis
    expose:
      - 6379

  web:
    build: .
    container_name: alz_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 alz_predictor.asgi:application"
    volumes:
      - static_volume:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=alz_predictor.settings.prod
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-key-please-replace-in-real-production-deploy
      - DATABASE_URL=postgres://postgres:postgres@db:5432/alz_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=*
      - SECURE_SSL_REDIRECT=False
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: alz_worker
    command: celery -A alz_predictor worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=alz_predictor.settings.prod
      - DEBUG=False
      - SECRET_KEY=django-insecure-prod-key-please-replace-in-real-production-deploy
      - DATABASE_URL=postgres://postgres:postgres@db:5432/alz_db
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=*
      - SECURE_SSL_REDIRECT=False
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:1.25-alpine
    container_name: alz_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
