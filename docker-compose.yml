version: '3.9'

# ──────────────────────────────────────────────────────
# Shared environment for web + worker
# ──────────────────────────────────────────────────────
x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: alz_predictor.settings.prod
  DEBUG: "False"
  SECRET_KEY: ${SECRET_KEY:-django-insecure-prod-key-CHANGE-IN-REAL-PROD}
  DATABASE_URL: postgres://postgres:postgres@db:5432/alz_db
  REDIS_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  CORS_ALLOW_ALL_ORIGINS: "True"
  SECURE_SSL_REDIRECT: "False"

services:
  # ── PostgreSQL Database ─────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: alz_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: alz_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Celery broker + Django Channels) ─────────
  redis:
    image: redis:7-alpine
    container_name: alz_redis
    restart: unless-stopped
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Django / Daphne Web App ─────────────────────────
  web:
    build:
      context: .
      target: runtime
    container_name: alz_web
    restart: unless-stopped
    environment:
      <<: *app-env
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"

  # ── Celery Worker ───────────────────────────────────
  worker:
    build:
      context: .
      target: runtime
    container_name: alz_worker
    restart: unless-stopped
    command: celery -A alz_predictor worker -l info -Q celery,priority --concurrency=4
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (scheduler) ─────────────────────────
  beat:
    build:
      context: .
      target: runtime
    container_name: alz_beat
    restart: unless-stopped
    command: celery -A alz_predictor beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: alz_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
