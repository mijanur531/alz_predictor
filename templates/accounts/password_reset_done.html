{% extends 'base.html' %}

{% block title %}Check Your Email - AlzPredictor{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="glass-card p-5 text-center">
            <h2 class="h3 fw-bold text-gradient mb-3">Check your email</h2>
            <p class="text-muted mb-4">If an account exists for that email address, you’ll receive a link to reset your password shortly.</p>
            <a href="{% url 'login' %}" class="btn btn-primary-gradient">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
